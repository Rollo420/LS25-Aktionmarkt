# nginx reverse-proxy: route requests to different upstreams based on Host

upstream default_backend {
    # point default backend to the running Laravel container (service name used by Docker Compose)
    server laravel.test:80;
}

upstream map1_backend {
    server app_map1:80;
}

upstream map2_backend {
    server app_map2:80;
}

# map hostname to upstream name
map $host $backend {
    hostnames;
    default default_backend;
    woodlypi.ddns.net default_backend;
    example1.com map1_backend;
    example2.com map2_backend;
}

server {
    listen 80;
    server_name _;
    # redirect to https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # using Pi-provided certificate files mounted into the container
    ssl_certificate /etc/ssl/certs/woodlypi.crt;
    ssl_certificate_key /etc/ssl/private/woodlypi.key;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$backend;
    }

    location ~ /\.well-known/acme-challenge/ {
        root /var/www/html/public;
        allow all;
    }
}
