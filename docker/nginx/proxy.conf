# nginx reverse-proxy: route requests to different upstreams based on Host

upstream default_backend {
    # point default backend to the running Laravel container (service name used by Docker Compose)
    server laravel.test:80;
}

upstream vite_backend {
    # Vite dev server inside the Laravel container
    server laravel.test:5173;
}


# map hostname to upstream name
map $host $backend {
    hostnames;
    default default_backend;
    woodlypi.ddns.net default_backend;
}

server {
    listen 80;
    server_name woodlypi.ddns.net;
    # redirect to https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name woodlypi.ddns.net;

    # using Pi-provided certificate files mounted into the container
    ssl_certificate /etc/ssl/certs/woodlypi.crt;
    ssl_certificate_key /etc/ssl/private/woodlypi.key;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_pass http://$backend;
    }

    # Vite dev client and assets (proxy client + websocket)
    location ~ ^/(@vite|@react-refresh|sockjs-node) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass http://vite_backend;
    }

    # Proxy other vite asset requests
    location ~ ^/node_modules/|^/resources/|^/assets/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vite_backend;
    }

    location ~ /\.well-known/acme-challenge/ {
        root /var/www/html/public;
        allow all;
    }
}
