# nginx reverse-proxy: route requests to different upstream hosts based on Host

# Use Docker embedded DNS inside the container for runtime resolution
# (127.0.0.11). We will map the incoming Host to backend host:port strings
# and let nginx resolve them at runtime via the `resolver` directive.

map $host $backend_host {
    hostnames;
    default "laravel.test:80";
    woodlypi.ddns.net "laravel.test:80";
}

map $host $vite_host {
    hostnames;
    default "laravel.test:5173";
}

server {
    listen 80;
    server_name woodlypi.ddns.net;
    # No ACME here; serve HTTP and redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name woodlypi.ddns.net;
    # Use server-provided certificate files mounted into the container
    ssl_certificate /etc/ssl/no-ip/woodlypi.crt;
    ssl_certificate_key /etc/ssl/no-ip/meine_domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Use Docker DNS resolver for dynamic hostname resolution at runtime
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
        # Use the mapped host:port and resolve at runtime
        proxy_pass http://$backend_host;
    }

    # Vite dev client and assets (proxy client + websocket)
    location ~ ^/(@vite|@react-refresh|sockjs-node) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_pass http://$vite_host;
    }

    # Proxy other vite asset requests
    location ~ ^/node_modules/|^/resources/|^/assets/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$vite_host;
    }

    location ~ /\.well-known/acme-challenge/ {
        root /var/www/html/public;
        allow all;
    }
}
